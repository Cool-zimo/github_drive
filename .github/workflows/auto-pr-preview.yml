name: Auto PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check config.json exists
        if: github.event.action != 'closed'
        id: check_config
        run: |
          if [ ! -f "config.json" ]; then
            echo "has_config=false" >> $GITHUB_OUTPUT
            echo "::warning::config.json not found"
          else
            echo "has_config=true" >> $GITHUB_OUTPUT
          fi

      - name: Close PR if no config.json
        if: github.event.action != 'closed' && steps.check_config.outputs.has_config == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `
            ## ❌ PR 被自动关闭
            
            **原因：缺少 config.json 配置文件**
            
            所有贡献必须包含 \`config.json\` 文件，用于标识作者、版本名称和分支名。
            
            ### 请按以下步骤修复：
            
            1. 在仓库根目录创建 \`config.json\`
            2. 填写以下内容：
            
            \`\`\`json
            {
              "author": "你的GitHub用户名",
              "name": "版本名称",
              "branch": "分支名",
              "description": "改进描述",
              "version": "1.0.0"
            }
            \`\`\`
            
            3. 重新提交 PR
            
            > 参考模板：\`config.example.json\`
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });

      - name: Validate config.json
        if: github.event.action != 'closed' && steps.check_config.outputs.has_config == 'true'
        id: validate
        run: |
          echo "config.json found:"
          cat config.json
          
          AUTHOR=$(python3 -c "import json; print(json.load(open('config.json')).get('author',''))" 2>/dev/null)
          NAME=$(python3 -c "import json; print(json.load(open('config.json')).get('name',''))" 2>/dev/null)
          BRANCH=$(python3 -c "import json; print(json.load(open('config.json')).get('branch',''))" 2>/dev/null)
          DESCRIPTION=$(python3 -c "import json; print(json.load(open('config.json')).get('description',''))" 2>/dev/null)
          VERSION=$(python3 -c "import json; print(json.load(open('config.json')).get('version','1.0.0'))" 2>/dev/null)
          
          if [ -z "$AUTHOR" ] || [ -z "$NAME" ] || [ -z "$BRANCH" ]; then
            echo "::error::config.json must contain 'author', 'name', and 'branch' fields"
            exit 1
          fi
          
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ config.json validation passed"

      - name: Create preview branch
        if: github.event.action != 'closed' && steps.check_config.outputs.has_config == 'true' && success()
        run: |
          AUTHOR="${{ steps.validate.outputs.author }}"
          NAME="${{ steps.validate.outputs.name }}"
          BRANCH="${{ steps.validate.outputs.branch }}"
          
          SANITIZED_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9_-]/-/g')
          PREVIEW_BRANCH="preview/${AUTHOR}/${SANITIZED_BRANCH}"
          
          echo "Creating preview branch: $PREVIEW_BRANCH"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -B "$PREVIEW_BRANCH"
          git push origin "$PREVIEW_BRANCH" --force
          
          echo "preview_branch=$PREVIEW_BRANCH" >> $GITHUB_OUTPUT
          echo "✅ Preview branch created: $PREVIEW_BRANCH"

      - name: Update preview branches registry on main
        if: github.event.action != 'closed' && steps.check_config.outputs.has_config == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const author = '${{ steps.validate.outputs.author }}';
            const name = '${{ steps.validate.outputs.name }}';
            const branch = '${{ steps.validate.outputs.branch }}';
            const description = '${{ steps.validate.outputs.description }}';
            const version = '${{ steps.validate.outputs.version }}';
            const previewBranch = `preview/${author}/${branch.replace(/[^a-zA-Z0-9_-]/g, '-')}`;
            
            // 获取当前 preview-branches.json
            let registry = { branches: [], updatedAt: new Date().toISOString() };
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'preview-branches.json',
                ref: 'main'
              });
              const content = Buffer.from(file.content, 'base64').toString();
              registry = JSON.parse(content);
            } catch (e) {
              console.log('Creating new preview-branches.json');
            }
            
            // 更新或添加分支信息
            const existingIndex = registry.branches.findIndex(b => b.branch === previewBranch);
            const branchInfo = {
              branch: previewBranch,
              author,
              name,
              description,
              version,
              sourceBranch: branch,
              prNumber: context.issue.number,
              updatedAt: new Date().toISOString()
            };
            
            if (existingIndex >= 0) {
              registry.branches[existingIndex] = branchInfo;
            } else {
              registry.branches.push(branchInfo);
            }
            
            registry.updatedAt = new Date().toISOString();
            
            // 写回 main 分支
            const content = Buffer.from(JSON.stringify(registry, null, 2)).toString('base64');
            const sha = registry.branches.length > 0 ? (await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'preview-branches.json',
              ref: 'main'
            })).data.sha : undefined;
            
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'preview-branches.json',
              message: `chore: 更新预览分支清单 - ${name}`,
              content,
              sha,
              branch: 'main'
            });
            
            console.log('✅ preview-branches.json updated on main');

      - name: Comment success on PR
        if: github.event.action != 'closed' && steps.check_config.outputs.has_config == 'true' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const author = '${{ steps.validate.outputs.author }}';
            const name = '${{ steps.validate.outputs.name }}';
            const branch = '${{ steps.validate.outputs.branch }}';
            const previewBranch = `preview/${author}/${branch.replace(/[^a-zA-Z0-9_-]/g, '-')}`;
            
            const comment = `
            ## ✅ 自动预览分支已创建
            
            | 字段 | 值 |
            |------|-----|
            | 作者 | ${author} |
            | 版本名称 | ${name} |
            | 分支名 | ${branch} |
            | 预览分支 | \`${previewBranch}\` |
            
            ### 如何测试此版本
            
            1. 打开 GitHub Drive
            2. 进入 设置 → 版本切换 → 版本广场
            3. 找到 "${name}" 并点击加载
            
            ### 直接访问
            https://cool-zimo.github.io/github_drive/?branch=${encodeURIComponent(previewBranch)}
            
            > 已自动添加到版本广场清单，所有用户都能看到此版本。
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Remove from registry when PR closed
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'preview-branches.json',
                ref: 'main'
              });
              const content = Buffer.from(file.content, 'base64').toString();
              const registry = JSON.parse(content);
              
              // 移除对应 PR 的分支
              registry.branches = registry.branches.filter(b => b.prNumber !== context.issue.number);
              registry.updatedAt = new Date().toISOString();
              
              const newContent = Buffer.from(JSON.stringify(registry, null, 2)).toString('base64');
              
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'preview-branches.json',
                message: `chore: 移除预览分支 - PR #${context.issue.number} 已关闭`,
                content: newContent,
                sha: file.sha,
                branch: 'main'
              });
              
              console.log('✅ Branch removed from registry');
            } catch (e) {
              console.log('No registry to update:', e.message);
            }
